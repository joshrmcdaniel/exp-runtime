name: Desktop builds

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
          - target: linux-x64
            runner: ubuntu-22.04
          - target: macos-arm64
            runner: macos-14
          - target: macos-x64
            runner: macos-15-intel
    defaults:
      run:
        shell: bash
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
      EXP_TARGET: ${{ matrix.target }}
      EXP_BUILD_LABEL: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.13'
          python-version: '3.14'
          enable-cache: true
          cache-suffix: ${{ matrix.target }}

      - name: Install locked dependencies
        run: uv sync --locked --extra build

      - name: Run tests without game content
        run: uv run --locked --extra build python -m unittest discover -s tests

      - name: Build desktop application
        run: uv run --locked --extra build python tools/build_desktop.py

      - name: Package, audit and test the extracted download
        run: >-
          uv run --locked --extra build python tools/package_desktop.py
          --target "$EXP_TARGET" --label "$EXP_BUILD_LABEL" --smoke-test

      - name: Upload downloadable archive and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.target }}
          path: dist/downloads/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish versioned downloads
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download all successful platform builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          path: dist/release
          merge-multiple: true

      - name: Verify downloaded checksums
        working-directory: dist/release
        run: sha256sum --check ./*.sha256

      - name: Create release or update its downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXP_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if draft=$(gh release view "$EXP_TAG" --repo "$GH_REPO" --json isDraft --jq .isDraft 2>/dev/null); then
            gh release upload "$EXP_TAG" dist/release/* --repo "$GH_REPO" --clobber
            if [[ "$draft" == true ]]; then
              gh release edit "$EXP_TAG" --repo "$GH_REPO" --draft=false
            fi
          else
            flags=()
            if [[ "$EXP_TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$EXP_TAG" dist/release/* \
              --repo "$GH_REPO" --verify-tag --title "EXP Runtime $EXP_TAG" \
              --notes-file RELEASE.md "${flags[@]}"
          fi
