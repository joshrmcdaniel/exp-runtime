name: iOS builds

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Unsigned iPhone app
    runs-on: macos-26
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
      EXP_BUILD_LABEL: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.13'
          python-version: '3.14'
          enable-cache: true
          cache-suffix: ios

      - name: Install locked host dependencies
        run: uv sync --locked --extra desktop

      - name: Run authored engine and packaging tests
        run: uv run --locked --extra desktop python -m unittest discover -s tests

      - name: Build simulator app
        run: uv run --locked --extra desktop python tools/build_ios.py --sdk iphonesimulator

      - name: Verify shared engine and native presentation on iOS
        run: uv run --locked --extra desktop python tools/test_ios.py

      - name: Upload simulator failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-simulator-diagnostics
          path: build/ios/simulator-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Build unsigned device app
        run: uv run --locked --extra desktop python tools/build_ios.py --sdk iphoneos

      - name: Audit and package unsigned IPA
        run: uv run --locked --extra desktop python tools/package_ios.py --label "$EXP_BUILD_LABEL"

      - name: Upload unsigned IPA, checksum and simulator verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-arm64-unsigned
          path: |
            dist/downloads/*-ios-arm64-unsigned.ipa
            dist/downloads/*-ios-arm64-unsigned.ipa.sha256
            build/ios/verification-simulator.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
