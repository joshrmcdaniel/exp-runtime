[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exp-runtime"
version = "0.3.0"
description = "A compatible EXP engine for Surviving High School and Cause of Death using player-supplied game files"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = ["shs", "surviving-high-school", "cause-of-death", "kiwi", "exp", "game-engine", "shs-runtime", "cod-runtime"]
dependencies = ["Pillow>=10"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
desktop = ["pygame-ce>=2.5.7,<3"]
build = ["pygame-ce>=2.5.7,<3", "pyinstaller>=6.16,<7"]

[project.scripts]
exp-tool = "exp_runtime.cli:main"
shs-tool = "exp_runtime.cli:main"

[project.gui-scripts]
exp-runtime = "exp_runtime.application:main"
shs = "exp_runtime.application:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
exp_runtime = ["assets/kiwi.svg"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["exp_runtime*"]
