[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shs-runtime"
version = "0.2.0"
description = "A compatible Surviving High School engine using player-supplied game files"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = ["shs", "surviving-high-school", "kiwi", "exp", "game-engine"]
dependencies = ["Pillow>=10"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
desktop = ["pygame-ce>=2.5.7,<3"]
build = ["pygame-ce>=2.5.7,<3", "pyinstaller>=6.16,<7"]

[project.scripts]
shs-tool = "shs_runtime.cli:main"

[project.gui-scripts]
shs = "shs_runtime.application:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["shs_runtime*"]
